<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>VOID FRONTIER · 正在返回星图</title>
  <style>
    /* 深空回退页：样式完全内联，独立可运行，禁止任何外部请求 */
    :root {
      --bg: #070b12;
      --panel: #0c1524;
      --line: #1c2b42;
      --fg: #c9d6e8;
      --muted: #6f8299;
      --accent: #4fd8c8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--fg);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      display: grid;
      place-items: center;
      background:
        radial-gradient(1px 1px at 18% 26%, rgba(233, 255, 251, .55) 50%, transparent 51%),
        radial-gradient(1px 1px at 68% 12%, rgba(233, 255, 251, .40) 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 84% 58%, rgba(79, 216, 200, .50) 50%, transparent 51%),
        radial-gradient(1px 1px at 34% 78%, rgba(233, 255, 251, .35) 50%, transparent 51%),
        radial-gradient(1px 1px at 52% 44%, rgba(233, 255, 251, .28) 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 90% 28%, rgba(233, 255, 251, .45) 50%, transparent 51%),
        radial-gradient(1px 1px at 10% 60%, rgba(233, 255, 251, .30) 50%, transparent 51%),
        radial-gradient(circle at 50% 130%, rgba(79, 216, 200, .10), transparent 55%),
        var(--bg);
    }
    .panel {
      max-width: 30rem;
      margin: 1.5rem;
      padding: 2.5rem 2.75rem;
      text-align: center;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(12, 21, 36, .92), rgba(7, 11, 18, .92));
      box-shadow: inset 0 0 40px rgba(79, 216, 200, .06);
    }
    .glyph svg { width: 40px; height: 40px; display: inline-block; }
    h1 {
      margin: 1rem 0 .5rem;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: .12em;
      color: var(--accent);
    }
    .en {
      margin: 0 0 1.25rem;
      font-size: .74rem;
      letter-spacing: .24em;
      color: var(--muted);
      text-transform: uppercase;
    }
    p { margin: 0; font-size: .88rem; line-height: 1.7; color: var(--muted); }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .35; }
    }
    a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(79, 216, 200, .4); }
    a:hover { border-bottom-color: var(--accent); }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
</head>
<body>
  <main class="panel">
    <div class="glyph" aria-hidden="true">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 10 L38 26 L54 32 L38 38 L32 54 L26 38 L10 32 L26 26 Z" fill="#4fd8c8"/>
      </svg>
    </div>
    <h1 class="pulse">正在返回星图…</h1>
    <p class="en">Returning to Star Chart</p>
    <p>检测到航路偏移，正在重新对接指挥中枢。</p>
    <noscript>
      <p>脚本已禁用：<a href="./">点击此处手动返回星图</a>。</p>
    </noscript>
  </main>
  <script>location.replace('./');</script>
</body>
</html>
