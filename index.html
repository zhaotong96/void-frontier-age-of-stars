<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>无垠边疆：星海纪元 — VOID FRONTIER: AGE OF STARS</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./styles.css" />
  <script>
    // 仅在 HTTP/HTTPS 环境下注入 PWA Manifest，杜绝 file:// 协议下的 CORS 报错
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = './manifest.webmanifest';
      document.head.appendChild(link);
    }
  </script>
</head>
<body>
  <noscript>
    <div class="boot-error">本游戏需要启用 JavaScript。所有逻辑均在浏览器本地运行，无任何远程依赖。</div>
  </noscript>

  <div id="app" aria-live="off">
    <!-- 启动画面（App 初始化后替换） -->
    <div id="boot" class="boot-screen">
      <div class="boot-title">VOID FRONTIER</div>
      <div class="boot-sub">星海纪元 · 初始化指挥系统…</div>
      <div class="boot-status" id="boot-status">加载核心模块</div>
    </div>
  </div>

  <script>
    /**
     * SPEC-PLAN-057 Task 57.4（BUG-05 / doc56 Task 56.1 §4）：单文件 Bundle 优先极速加载器。
     * - 默认生产（含 file://）：直载 ./dist/void-frontier.bundle.js，1 个请求取代
     *   188 个独立 JS 模块的跨洋瀑布，冷启动由分钟级降至秒级；
     * - ?esm=1：开发者调试模式，直载 ./src/main.js；
     * - Bundle 加载失败 → 回退 ESM 源码；8 秒内未完成启动 → #boot-status 给出可见重试按钮，
     *   专治「深层子模块挂起但不触发顶层 onerror」的静默卡死。
     */
    (function bootLoader() {
      var statusEl = document.getElementById('boot-status');
      var retryShown = false;
      var useESM = new URLSearchParams(window.location.search).get('esm') === '1';

      function isBootDone() {
        return !!(window.__bootSteps && window.__bootSteps.indexOf('boot:end') >= 0);
      }
      function showRetry(reason) {
        if (retryShown || !statusEl) return;
        retryShown = true;
        statusEl.textContent = '启动超时或加载失败：' + reason;
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'vf-btn small primary';
        btn.textContent = '↻ 重新加载';
        btn.style.marginLeft = '8px';
        btn.addEventListener('click', function () { location.reload(); });
        statusEl.appendChild(btn);
      }
      function armWatchdog(tag) {
        setTimeout(function () {
          if (!isBootDone()) showRetry(tag + ' 未在 8 秒内完成启动');
        }, 8000);
      }
      function loadESM(isFallback) {
        var m = document.createElement('script');
        m.type = 'module';
        m.src = './src/main.js';
        m.onerror = function () { showRetry('ESM 源码加载失败'); };
        document.body.appendChild(m);
        armWatchdog(isFallback ? 'ESM 回退' : 'ESM 调试');
      }
      if (useESM) {
        console.log('[BOOT] 开发者模式：直接加载 ESM 源码');
        loadESM(false);
        return;
      }
      console.log('[BOOT] 生产模式：加载单文件 Bundle 极速启动');
      var s = document.createElement('script');
      s.src = './dist/void-frontier.bundle.js';
      s.onerror = function () {
        console.warn('[BOOT] Bundle 加载异常，降级回退至 ESM 源码');
        loadESM(true);
      };
      document.body.appendChild(s);
      armWatchdog('Bundle');
    })();
  </script>
</body>
</html>
